# Plano de despliegue para Render (https://render.com).
#
# Como usarlo:
#   1. Entrar a https://dashboard.render.com/blueprints y elegir "New Blueprint".
#   2. Conectar este repositorio de GitHub. Render lee este archivo solo.
#   3. Render va a pedir el email y la contrasena del primer administrador.
#   4. Al terminar queda un link publico tipo https://engel-ventas.onrender.com
#
# Importante: el plan tiene que ser de pago (starter o superior) porque el
# plan gratuito no permite disco persistente, y sin disco se pierden la base
# de datos y la documentacion en cada actualizacion.

services:
  - type: web
    name: engel-ventas
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/salud

    # Disco donde viven la base y los archivos de documentacion.
    disk:
      name: engel-datos
      mountPath: /datos
      sizeGB: 5

    envVars:
      - key: NODE_ENV
        value: production
      # Render genera una clave larga y aleatoria, y no hay que tocarla nunca.
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /datos/engel.db
      - key: UPLOAD_DIR
        value: /datos/documentacion
      # La web se sirve por HTTPS, asi que las cookies van seguras.
      - key: SECURE_COOKIES
        value: "true"
      - key: MAX_FILE_MB
        value: "25"
      # Un respaldo automatico cada 3 horas, conservando los ultimos 24.
      - key: RESPALDO_CADA_MINUTOS
        value: "180"
      - key: RESPALDOS_A_CONSERVAR
        value: "24"
      # Estos dos los pide Render al desplegar: son los del primer ingreso.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NOMBRE
        sync: false
