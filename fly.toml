# Configuracion para Fly.io (https://fly.io).
#
# Pasos:
#   fly launch --no-deploy --copy-config
#   fly volumes create engel_datos --size 5
#   fly secrets set SESSION_SECRET=$(node -e "console.log(require('crypto').randomBytes(48).toString('hex'))")
#   fly secrets set ADMIN_EMAIL=tuemail@engel.com ADMIN_PASSWORD=una-clave-larga
#   fly deploy
#
# Queda publicada en https://<nombre-de-la-app>.fly.dev

app = "engel-ventas"
primary_region = "eze"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DB_PATH = "/datos/engel.db"
  UPLOAD_DIR = "/datos/documentacion"
  SECURE_COOKIES = "true"
  MAX_FILE_MB = "25"
  RESPALDO_CADA_MINUTOS = "180"
  RESPALDOS_A_CONSERVAR = "24"

[[mounts]]
  source = "engel_datos"
  destination = "/datos"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Una sola maquina: la base es un archivo y no se comparte entre varias.
  min_machines_running = 1

  [http_service.http_options.response.headers]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/salud"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
